[build]
  # Netlify site base directory: repo root (npm workspaces need the root install).
  command = "npm run build --workspace=admin-dashboard"
  publish = "admin-dashboard/.next"

[build.environment]
  NODE_VERSION = "20.19.4"
  NPM_FLAGS = "--legacy-peer-deps"

[[plugins]]
  package = "@netlify/plugin-nextjs"
