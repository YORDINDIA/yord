[build]
  # For a Netlify admin site: "Package directory" `admin-dashboard/`, base
  # directory the repo root (paths resolve against the base). The admin
  # prerenders nothing ((admin)/layout.tsx is force-dynamic), so the build
  # needs no Supabase variables — set the NEXT_PUBLIC_* values in BOTH the
  # "Production" and "Deploy previews" environments for a working build.
  command = "npm run build --workspace=admin-dashboard"
  publish = "admin-dashboard/.next"

[build.environment]
  NODE_VERSION = "20.19.4"
  NPM_FLAGS = "--legacy-peer-deps"

[[plugins]]
  # Pinned — see frontend/netlify.toml for the reason.
  package = "@netlify/plugin-nextjs@5.16.4"
