name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Mock env so lint / typecheck / build pass without real credentials.
# No secrets are required or referenced by any step.
env:
  NEXT_PUBLIC_SUPABASE_URL: http://localhost
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key-for-ci
  SUPABASE_SECRET_KEY: test-secret-key-for-ci
  RAZORPAY_KEY_ID: test-key-id
  RAZORPAY_KEY_SECRET: test-key-secret
  NEXT_PUBLIC_RAZORPAY_KEY_ID: test-key-id
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_APP_NAME: YORD India
  NEXT_PUBLIC_POSTHOG_KEY: test-posthog-key
  NEXT_PUBLIC_POSTHOG_HOST: http://localhost
  AGNES_AI_API_KEY: test-agnes-key
  AGNES_TEXT_MODEL: test-model
  AGNES_IMAGE_MODEL: test-image-model
  # Read lazily by the media action and the AI image route; mocks keep any
  # import-time read safe and let the admin build prerender.
  R2_ACCOUNT_ID: test-account
  R2_ACCESS_KEY_ID: test-key-id
  R2_SECRET_ACCESS_KEY: test-secret-key
  R2_BUCKET: yord-media-test
  R2_PUBLIC_BASE_URL: https://pub-test.r2.dev

jobs:
  web:
    name: web (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, admin-dashboard]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20.19.4
          cache: npm

      - name: Install (npm workspaces)
        # --legacy-peer-deps: pre-existing peer conflict, unrelated to CI:
        # root package.json pins react 18 (Remotion) while
        # the apps pin react 19 (see follow-ups).
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint --workspace=${{ matrix.app }}

      - name: Typecheck
        run: npm run typecheck --workspace=${{ matrix.app }}

      - name: Test
        run: npm run test --workspace=${{ matrix.app }}

      - name: Build
        run: npm run build --workspace=${{ matrix.app }}

  python:
    name: python (scripts compileall)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile all migration scripts
        run: python -m compileall scripts/
